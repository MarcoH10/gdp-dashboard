[theme]
primaryColor = "#3182ce"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#edf2f7"
textColor = "#1a202c"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
